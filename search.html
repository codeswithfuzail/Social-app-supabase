<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — Kindred</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/search.css">
</head>

<body>

  <div class="app-shell">
    <div id="shellMount"></div>

    <main class="k-content">
      <div class="k-topbar">
        <button id="kMenuToggle" class="btn-k btn-k-ghost"><i class="bi bi-list"></i></button>
        <div class="k-logo" style="font-size:1.2rem;"><span class="k-mark"
            style="width:26px;height:26px;font-size:.8rem;">K</span>Kindred</div>
        <img id="topbarAvatar" class="k-avatar" width="34" height="34" alt="">
      </div>

      <div class="k-search-wrap mx-auto">
        <h1 class="font-display mb-1">Find people</h1>
        <p class="text-muted mb-4">Search by name or username.</p>

        <div class="k-search-box mb-4">
          <i class="bi bi-search"></i>
          <input type="text" id="searchInput" class="k-input" placeholder="Search users...">
        </div>

        <div id="searchResults"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/search.js"></script>
</body>

</html>
