<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorer — Kindred</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/explorer.css">
</head>

<body>

  <div class="app-shell">
    <div id="shellMount"></div>

    <main class="k-content">
      <div class="k-topbar">
        <button id="kMenuToggle" class="btn-k btn-k-ghost"><i class="bi bi-list"></i></button>
        <div class="k-logo" style="font-size:1.2rem;"><span class="k-mark"
            style="width:26px;height:26px;font-size:.8rem;">K</span>Kindred</div>
        <img id="topbarAvatar" class="k-avatar" width="34" height="34" alt="">
      </div>

      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <div>
          <h1 class="font-display mb-1">Explore</h1>
          <p class="text-muted mb-0">Discover posts and people across Kindred.</p>
        </div>
        <ul class="nav nav-pills k-pill-tabs">
          <li class="nav-item"><button class="nav-link active" data-explore-tab="recent">Recent</button></li>
          <li class="nav-item"><button class="nav-link" data-explore-tab="popular">Popular</button></li>
        </ul>
      </div>

      <div id="suggestedUsersRow" class="mb-4"></div>

      <div id="exploreGrid" class="k-masonry"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/explorer.js"></script>
</body>

</html>
