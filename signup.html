<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your account — Kindred</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/signup.css">
</head>

<body>

  <div class="auth-shell">
    <div class="auth-visual"
      style="background-image:url('https://images.unsplash.com/photo-1531482615713-2afd69097998?w=1400&q=80');">
      <div class="auth-quote">
        <div class="k-logo mb-4"><span class="k-mark">K</span>Kindred</div>
        <h2 class="font-display" style="max-width:420px;">Where real people share real moments.</h2>
        <p class="text-white-50">Join a community built around genuine connection, not endless scrolling.</p>
      </div>
    </div>

    <div class="auth-form-col">
      <div class="auth-card">
        <div class="d-lg-none k-logo mb-4"><span class="k-mark">K</span>Kindred</div>
        <h1 class="font-display mb-1" style="font-size:2rem;">Create your account</h1>
        <p class="text-muted mb-4">It only takes a minute.</p>

        <button type="button" id="googleBtn" class="btn-google mb-3">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4"
              d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z" />
            <path fill="#34A853"
              d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z" />
            <path fill="#FBBC05"
              d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z" />
            <path fill="#EA4335"
              d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z" />
          </svg>
          Continue with Google
        </button>

        <div class="d-flex align-items-center gap-3 my-3">
          <hr class="flex-grow-1" style="border-color:var(--border);">
          <span class="text-muted small">or sign up with email</span>
          <hr class="flex-grow-1" style="border-color:var(--border);">
        </div>

        <form id="signupForm" novalidate>
          <div class="row">
            <div class="col-6 k-field">
              <label class="k-label">First name</label>
              <input class="k-input" type="text" id="firstName" required>
              <div class="k-error-text"></div>
            </div>
            <div class="col-6 k-field">
              <label class="k-label">Last name</label>
              <input class="k-input" type="text" id="lastName" required>
              <div class="k-error-text"></div>
            </div>
          </div>

          <div class="k-field">
            <label class="k-label">Username</label>
            <input class="k-input" type="text" id="username" placeholder="e.g. jane_doe" required>
            <div class="k-error-text"></div>
          </div>

          <div class="k-field">
            <label class="k-label">Email</label>
            <input class="k-input" type="email" id="email" required>
            <div class="k-error-text"></div>
          </div>

          <div class="k-field">
            <label class="k-label">Password</label>
            <div class="k-pw-wrap">
              <input class="k-input" type="password" id="password" minlength="6" required>
              <button type="button" class="k-pw-toggle" data-toggle-for="password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="k-error-text"></div>
          </div>

          <div class="row">
            <div class="col-6 k-field">
              <label class="k-label">Age</label>
              <input class="k-input" type="number" id="age" min="13" max="120">
            </div>
            <div class="col-6 k-field">
              <label class="k-label">Gender</label>
              <select class="k-select" id="gender">
                <option value="">Prefer not to say</option>
                <option>Woman</option>
                <option>Man</option>
                <option>Non-binary</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-6 k-field">
              <label class="k-label">City</label>
              <input class="k-input" type="text" id="city">
            </div>
            <div class="col-6 k-field">
              <label class="k-label">Country</label>
              <input class="k-input" type="text" id="country">
            </div>
          </div>

          <div class="k-field">
            <label class="k-label">Bio</label>
            <textarea class="k-input" id="bio" rows="2" placeholder="Tell people a little about yourself"></textarea>
          </div>

          <!-- Profile picture -->
          <div class="k-field">
            <label class="k-label">Profile picture</label>
            <ul class="nav nav-pills k-pill-tabs mb-2" role="tablist">
              <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#avatarUrlTab"
                  type="button">Image URL</button></li>
              <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#avatarUploadTab"
                  type="button">Upload</button></li>
            </ul>
            <div class="tab-content">
              <div class="tab-pane fade show active" id="avatarUrlTab">
                <input class="k-input" type="url" id="avatarUrl" placeholder="https://...">
              </div>
              <div class="tab-pane fade" id="avatarUploadTab">
                <input class="k-input" type="file" id="avatarFile" accept="image/*">
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mt-2">
              <img id="avatarPreview" class="k-avatar" width="46" height="46" alt="Preview">
              <span class="text-muted small">Preview — a default avatar is used if you skip this.</span>
            </div>
          </div>

          <!-- Cover image -->
          <div class="k-field">
            <label class="k-label">Cover image</label>
            <ul class="nav nav-pills k-pill-tabs mb-2" role="tablist">
              <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#coverUrlTab"
                  type="button">Image URL</button></li>
              <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#coverUploadTab"
                  type="button">Upload</button></li>
            </ul>
            <div class="tab-content">
              <div class="tab-pane fade show active" id="coverUrlTab">
                <input class="k-input" type="url" id="coverUrl" placeholder="https://...">
              </div>
              <div class="tab-pane fade" id="coverUploadTab">
                <input class="k-input" type="file" id="coverFile" accept="image/*">
              </div>
            </div>
          </div>

          <div class="k-field" id="formErrorBox" style="display:none;">
            <div class="alert alert-danger py-2 px-3 small mb-0"></div>
          </div>

          <button type="submit" class="btn-k btn-k-primary w-100 mt-2" id="signupBtn">
            <i class="bi bi-arrow-right-circle"></i> Sign Up
          </button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
          Already have an account? <a href="login.html" class="fw-semibold" style="color:var(--accent);">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
</body>

</html>
