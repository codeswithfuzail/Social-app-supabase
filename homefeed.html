<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Feed — Kindred</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/homefeed.css">
</head>

<body>

  <div class="app-shell">
    <div id="shellMount"></div>

    <main class="k-content">
      <div class="k-topbar">
        <button id="kMenuToggle" class="btn-k btn-k-ghost"><i class="bi bi-list"></i></button>
        <div class="k-logo" style="font-size:1.2rem;"><span class="k-mark"
            style="width:26px;height:26px;font-size:.8rem;">K</span>Kindred</div>
        <img id="topbarAvatar" class="k-avatar" width="34" height="34" alt="">
      </div>

      <div class="k-feed-wrap mx-auto">
        <!-- Composer -->
        <button class="k-card w-100 text-start p-3 mb-4 d-flex align-items-center gap-3 k-composer-btn"
          data-bs-toggle="modal" data-bs-target="#createPostModal">
          <img id="composerAvatar" class="k-avatar" width="40" height="40" alt="">
          <span class="text-muted">What's on your mind?</span>
          <i class="bi bi-image ms-auto text-muted"></i>
        </button>

        <div id="feedList"></div>
      </div>
    </main>
  </div>

  <!-- Create Post Modal (shared with dashboard) -->
  <div class="modal fade" id="createPostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content k-modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title font-display">Create post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="createPostForm">
            <textarea class="k-input mb-3" id="postContent" rows="3" placeholder="What's on your mind?"></textarea>
            <ul class="nav nav-pills k-pill-tabs mb-2">
              <li class="nav-item"><button class="nav-link active" type="button" data-media-tab="none">Text
                  only</button></li>
              <li class="nav-item"><button class="nav-link" type="button" data-media-tab="image">Image</button></li>
              <li class="nav-item"><button class="nav-link" type="button" data-media-tab="video">Video</button></li>
            </ul>
            <div id="mediaPaneImage" style="display:none;">
              <div class="k-field"><label class="k-label">Image URL</label><input class="k-input" type="url"
                  id="postImageUrl" placeholder="https://..."></div>
              <div class="k-field"><label class="k-label">or upload from device</label><input class="k-input"
                  type="file" id="postImageFile" accept="image/*"></div>
            </div>
            <div id="mediaPaneVideo" style="display:none;">
              <div class="k-field"><label class="k-label">Upload MP4 video</label><input class="k-input" type="file"
                  id="postVideoFile" accept="video/mp4"></div>
            </div>
            <button type="submit" class="btn-k btn-k-primary w-100 mt-2" id="createPostBtn"><i class="bi bi-send"></i>
              Post</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/homefeed.js"></script>
</body>

</html>
